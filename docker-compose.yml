version: "3.8"

services:
  # =================================================================
  # PostgreSQL Database
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: churn_poacher_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-churn_poacher}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-churn_poacher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - churn_poacher_net

  # =================================================================
  # Redis Queue & Cache
  # =================================================================
  redis:
    image: redis:7-alpine
    container_name: churn_poacher_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - churn_poacher_net

  # =================================================================
  # FastAPI Backend API
  # =================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churn_poacher_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/churn_poacher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-churn-poacher-secret-key-change-in-production-env-7a8b9c}
      ENABLE_AUTH: ${ENABLE_AUTH:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HACKER_NEWS_API_BASE: ${HACKER_NEWS_API_BASE:-https://hn.algolia.com/api/v1}
      DATADOG_STATUS_PAGE_URL: ${DATADOG_STATUS_PAGE_URL:-https://status.datadoghq.com/api/v2/summary.json}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - churn_poacher_net

  # =================================================================
  # Persistent Background Task Worker
  # =================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: churn_poacher_worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/churn_poacher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-churn-poacher-secret-key-change-in-production-env-7a8b9c}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - churn_poacher_net

  # =================================================================
  # Next.js Frontend Dashboard
  # =================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: churn_poacher_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - churn_poacher_net

networks:
  churn_poacher_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
